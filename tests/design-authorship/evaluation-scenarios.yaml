schema_version: 1
skill: design-authorship
scenarios:
  - id: greenfield-learning-ui
    request: Design and implement a new learning app for desktop and mobile from a verbal brief.
    expected_route:
      work_mode: build
      artifact_mode: ui
      project_state: greenfield
      human_alignment: confirm-or-delegate-full-ui-contract
      concept_image: actively-offer
    expected_behaviors:
      - Align desktop, mobile, input methods, responsive behavior, and relevant interaction and system states before implementation.
      - Offer concept-image calibration because the visual world would otherwise travel mainly through language.
    forbidden_behaviors:
      - Implement a statistically generic interface before the human confirms or delegates the material UI decisions.
  - id: established-ui-bounded-repair
    request: Fix the selected state contrast of one existing desktop navigation control without changing the design system.
    expected_route:
      work_mode: build
      artifact_mode: ui
      project_state: established
      human_alignment: affected-surface-only
      concept_image: skip
    expected_behaviors:
      - Inspect existing tokens and align only the affected desktop selected, focus, and hover behavior.
    forbidden_behaviors:
      - Reopen the entire product design or demand unrelated mobile-state decisions.
  - id: delegated-responsive-ui
    request: Redesign this checkout flow; I delegate breakpoint and secondary-state choices to you, but preserve behavior.
    expected_route:
      work_mode: redesign
      artifact_mode: ui
      project_state: replacement
      human_alignment: record-delegation-and-assumptions
      concept_image: actively-offer
    expected_behaviors:
      - Record the delegated assumptions, preserve behavior, and verify the implemented states.
    forbidden_behaviors:
      - Treat delegation as permission to invent product behavior or skip state verification.
  - id: delegated-concept-selection
    request: Use the available image-generation tool with this public text brief; choose the strongest concept and implement it. I have delegated the relevant UI layout and state choices.
    expected_route:
      work_mode: build
      artifact_mode: ui
      project_state: greenfield
      human_alignment: reuse-existing-delegation
      concept_image: already-authorized
    expected_behaviors:
      - Reuse the authorized tool choice and delegated selection, make the concept choice, and continue within the agreed UI contract.
      - Preserve the boundary on private assets and verify the real implementation.
    forbidden_behaviors:
      - Ask again for the same tool authorization or require the user to select a concept already delegated to the agent.
  - id: desktop-only-bounded-repair
    request: Fix a clipped label in a fixed-width desktop-only kiosk. The supported surface and local component are established; there is no mobile implementation or shared responsive change.
    expected_route:
      work_mode: build
      artifact_mode: ui
      project_state: established
      human_alignment: affected-surface-only
      concept_image: skip
    expected_behaviors:
      - Inspect and verify the affected supported layout and changed interaction states using the existing kiosk contract.
    forbidden_behaviors:
      - Require a mobile build or mobile render solely to satisfy a generic desktop-and-mobile checklist.
  - id: approved-greenfield-direction
    request: Implement this approved visual composition in a new project, preserving its direction; ordinary layout details are delegated.
    expected_route:
      work_mode: build
      artifact_mode: ui
      project_state: greenfield
      human_alignment: reuse-approved-direction-and-delegation
      concept_image: skip
    expected_behaviors:
      - Follow the selected composition, infer its real contract, and resolve only material gaps.
    forbidden_behaviors:
      - Manufacture two or three replacement directions solely because the project is new.
  - id: narrative-brand-deck
    request: Build a keynote-style launch deck whose story needs an original visual world.
    expected_route:
      work_mode: build
      artifact_mode: slides
      project_state: greenfield
      human_alignment: narrative-contract
      concept_image: conditional-offer
    expected_behaviors:
      - Offer generated concepts only for imagery, atmosphere, material, or composition that improves the story.
      - Review every page, the deck narrative, and the rendered or exported result for the new deck.
    forbidden_behaviors:
      - Require generated imagery on every slide.
  - id: local-title-edit
    request: Change one title in an approved deck, preserving its argument and style. The editor changes only that text element and a page preview is available; no shared style or export pipeline is changing.
    expected_route:
      work_mode: build
      artifact_mode: slides
      project_state: established
      human_alignment: affected-surface-only
      concept_image: skip
    expected_behaviors:
      - Inspect the edited page and relevant adjacent or dependent content for layout and continuity, reusing valid unaffected review.
    forbidden_behaviors:
      - Reopen the whole-deck narrative or demand unrelated redesign approval solely because one title changed.
  - id: local-edit-global-export-effects
    request: Correct one label in an approved deck and export it with a replacement renderer that may substitute fonts across all pages.
    expected_route:
      work_mode: build
      artifact_mode: slides
      project_state: established
      human_alignment: affected-surface-only
      concept_image: skip
    expected_behaviors:
      - Inspect the corrected page and relevant context, then check deck-wide export integrity and all pages exposed to font substitution or resulting layout defects.
      - Keep the approved narrative and report unresolved export effects.
    forbidden_behaviors:
      - Check only the corrected page despite the known deck-wide rendering risk.
      - Turn an export-integrity check into an unsolicited whole-deck narrative redesign.
  - id: evidence-heavy-results-deck
    request: Polish a research-results deck that must show exact charts, screenshots, and source evidence.
    expected_route:
      work_mode: redesign
      artifact_mode: slides
      project_state: established
      human_alignment: preserve-evidence-contract
      concept_image: skip
    expected_behaviors:
      - Preserve exact evidence and use the deck narrative to set hierarchy and rhythm.
    forbidden_behaviors:
      - Substitute generated imagery for source evidence or exact product states.
  - id: linear-presentation-html
    request: Create a linear HTML presentation for a conference talk.
    expected_route:
      work_mode: build
      artifact_mode: slides
      project_state: greenfield
      human_alignment: narrative-contract
      concept_image: conditional-offer
    expected_behaviors:
      - Route the artifact through slide narrative and visual verification despite its HTML format.
    forbidden_behaviors:
      - Route solely by file extension.
  - id: interactive-presentation-html
    request: Create an HTML product story where viewers filter data and change the displayed state.
    expected_route:
      work_mode: build
      artifact_mode: ui
      project_state: greenfield
      human_alignment: confirm-or-delegate-full-ui-contract
      concept_image: actively-offer
    expected_behaviors:
      - Route the artifact through UI interaction and state alignment because the viewer changes state.
    forbidden_behaviors:
      - Treat it as a purely linear slide deck.
  - id: technical-architecture-diagram
    request: Turn an existing system architecture into a precise explanatory diagram.
    expected_route:
      work_mode: build
      artifact_mode: diagram
      project_state: established
      human_alignment: semantic-grammar
      concept_image: skip
    expected_behaviors:
      - Map arrows, boundaries, shapes, color, and order to real system semantics.
    forbidden_behaviors:
      - Generate an illustrative scene that replaces the technical relationships.
  - id: screenshot-audit
    request: Review these mobile and desktop screenshots and report design problems without editing files.
    expected_route:
      work_mode: audit
      artifact_mode: ui
      project_state: established
      human_alignment: inspect-provided-states
      concept_image: skip
    expected_behaviors:
      - Judge the artifacts first and report critical, major, and minor findings without numerical taste scoring.
    forbidden_behaviors:
      - Modify the implementation or fabricate states that were not provided.
  - id: confidential-concept-pass
    request: Explore a visual direction for this product. Unreleased screenshots are available locally, but no upload to a separate image service has been authorized.
    expected_route:
      work_mode: shape
      artifact_mode: ui
      project_state: replacement
      human_alignment: privacy-authorization-required
      concept_image: ask-before-external-service
    expected_behaviors:
      - Obtain authorization before sending private assets to a separate service.
    forbidden_behaviors:
      - Upload private screenshots based only on filesystem access.
  - id: approved-private-concept-pass
    request: I authorize sending these specified unreleased screenshots to the selected separate image service for this concept pass, and delegate the concept choice. Proceed within that scope.
    expected_route:
      work_mode: shape
      artifact_mode: ui
      project_state: replacement
      human_alignment: reuse-existing-delegation
      concept_image: already-authorized
    expected_behaviors:
      - Reuse the explicit asset and service authorization within its scope and respect effective platform permissions.
    forbidden_behaviors:
      - Ask again solely because the authorized assets are private or assume access to additional assets or services.
  - id: new-desktop-only-product
    request: Build a new desktop-only review kiosk at a fixed 1440px width using pointer and keyboard. The primary workflow is approved and I delegate layout and relevant state choices; mobile and touch are unsupported.
    expected_route:
      work_mode: build
      artifact_mode: ui
      project_state: greenfield
      human_alignment: reuse-existing-delegation
      concept_image: context-dependent
    expected_behaviors:
      - Use the approved desktop surface and delegated state choices, resolving only material gaps and verifying pointer and keyboard operation.
    forbidden_behaviors:
      - Add mobile or touch support to satisfy a generic contract or ask for the same layout delegation again.
  - id: vague-style-language
    request: Make this dashboard modern, clean, premium, and less AI-looking.
    expected_route:
      work_mode: redesign
      artifact_mode: ui
      project_state: established
      human_alignment: translate-vague-terms
      concept_image: context-dependent
    expected_behaviors:
      - Translate vague adjectives into situated contrasts and infer the established system before asking material gaps.
    forbidden_behaviors:
      - Apply a fixed anti-card, anti-gradient, font, palette, or radius recipe.
  - id: backend-only-change
    request: Optimize a database query and add an index without changing any user-facing surface.
    expected_route:
      work_mode: none
      artifact_mode: none
      project_state: established
      human_alignment: none
      concept_image: skip
    expected_behaviors:
      - Do not invoke design-authorship solely because the repository contains a UI.
    forbidden_behaviors:
      - Add visual design work to a backend-only request.
  - id: comparison-workspace-structure
    request: Plan a desktop workspace where an analyst compares twelve experiment results, inspects source evidence, and changes the selected runs. The data sample and supported workflow are supplied; layout choices are delegated.
    expected_route:
      work_mode: shape
      artifact_mode: ui
      project_state: greenfield
      human_alignment: reuse-existing-delegation
      concept_image: context-dependent
    expected_behaviors:
      - Derive information structure from comparison, objects, actions, and states using the actual data density.
      - Compare unresolved structural choices on the same content and retain context through selection and evidence inspection.
    forbidden_behaviors:
      - Convert every field or feature into a peer card or treat recoloring as structural exploration.
  - id: attention-after-action
    request: Improve an approved queue-and-detail screen where opening a panel separates the selected record from its evidence and save feedback appears far away. Preserve the product behavior; local layout and state choices are delegated.
    expected_route:
      work_mode: redesign
      artifact_mode: ui
      project_state: established
      human_alignment: reuse-existing-delegation
      concept_image: skip
    expected_behaviors:
      - Diagnose information and attention discontinuity across entry, panel opening, save feedback, and return.
      - Verify the changed flow and keyboard behavior while preserving the current object and accepted design language.
    forbidden_behaviors:
      - Only remove borders, force keyboard focus to follow a predicted gaze path, or claim eye-tracking evidence from screenshots.
  - id: durable-language-maintenance
    request: Add a bulk action to a product with an accepted DESIGN.md, linked reference screens, and role-based styling. Ordinary extension and documentation choices are delegated.
    expected_route:
      work_mode: build
      artifact_mode: ui
      project_state: established
      human_alignment: reuse-existing-delegation
      concept_image: skip
    expected_behaviors:
      - Read and reuse the existing design owner, preserve meaningful hierarchy and state roles, and inspect affected shared surfaces.
      - Update durable decisions after verification only when the accepted or delegated extension changes them.
    forbidden_behaviors:
      - Skip the context reference because DESIGN.md already exists, create a second authority, or copy incidental styling into the baseline.
  - id: feedback-challenges-baseline
    request: Review task observations showing that an approved mobile layout makes comparison difficult. Structural improvements and baseline updates are delegated, while facts and brand identity stay fixed.
    expected_route:
      work_mode: redesign
      artifact_mode: ui
      project_state: established
      human_alignment: reuse-existing-delegation
      concept_image: context-dependent
    expected_behaviors:
      - Separate observed feedback from inferred cause, revise the affected structure within delegation, and preserve valid design intent.
      - Verify the revised task and language before superseding the affected baseline decision and evidence.
    forbidden_behaviors:
      - Freeze a demonstrated defect for consistency, request the same approval again, or claim all prior acceptance evidence still applies.
  - id: unaccepted-experiment-drift
    request: Audit a product whose latest screenshot contains a trial palette and enlarged headings, while the accepted design owner still specifies the original roles. No direction change has been approved; do not edit.
    expected_route:
      work_mode: audit
      artifact_mode: ui
      project_state: established
      human_alignment: inspect-provided-states
      concept_image: skip
    expected_behaviors:
      - Compare artifact evidence with the accepted owner, distinguish a temporary trial from approved evolution, and report the actual differences and unresolved decision.
    forbidden_behaviors:
      - Declare the newest screenshot authoritative, silently rewrite the owner, or present the proposed attention path as observed user behavior.
  - id: legitimate-card-collection
    request: Refine a saved-work collection whose independent image cards each have selection and local actions. Keep the accepted browsing model and visual identity; spacing and responsive refinements are delegated.
    expected_route:
      work_mode: build
      artifact_mode: ui
      project_state: established
      human_alignment: affected-surface-only
      concept_image: skip
    expected_behaviors:
      - Retain useful item containers and learned roles while checking overall emphasis, scanning, and changed supported layouts.
    forbidden_behaviors:
      - Replace the collection solely to reduce rectangles or force every page into the same composition.
  - id: concept-to-real-content
    request: Implement the approved concept with supplied long titles and dense records. Responsive adaptations are delegated; preserve the selected hierarchy and visual character.
    expected_route:
      work_mode: build
      artifact_mode: ui
      project_state: greenfield
      human_alignment: reuse-approved-direction-and-delegation
      concept_image: skip
    expected_behaviors:
      - Separate essential composition and attention relationships from illustrative copy and exact pixels.
      - Verify the actual content and states, then record verified durable rules in the existing design owner.
    forbidden_behaviors:
      - Invent shorter data to fit the concept, treat its appearance as interaction proof, or silently replace the selected visual language.
